---
# tasks file for setup_inception

- name: Copy requirements folder
  ansible.builtin.copy:
    src: ../../../../srcs/requirements/
    dest: /home/{{ deploy_user }}/var/www/cloud-1/requirements/
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0755'
  become: true

- name: Create nginx folder
  ansible.builtin.file:
    path: /home/{{ deploy_user }}/var/www/cloud-1/requirements/nginx/conf
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0755'
  become: true

- name: Render nginx Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: /home/{{ deploy_user }}/var/www/cloud-1/requirements/nginx/Dockerfile
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0644'
  become: true

- name: Render nginx config
  ansible.builtin.template:
    src: default.conf.j2
    dest: /home/{{ deploy_user }}/var/www/cloud-1/requirements/nginx/conf/default.conf
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0644'
  become: true

- name: Render Docker Compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /home/{{ deploy_user }}/var/www/cloud-1/docker-compose.yml
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0644'
  become: true

- name: copy .env chiffre
  ansible.builtin.copy:
    src: ../files/.env
    dest: /home/{{ deploy_user }}/var/www/cloud-1/.env
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0600'
  become: true