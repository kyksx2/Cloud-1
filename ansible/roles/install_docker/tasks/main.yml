---
# tasks file for install_docker
# https://blog.stephane-robert.info/docs/conteneurs/moteurs-conteneurs/docker/installation/
# https://docs.docker.com/engine/install/ubuntu/
# - name: updated packets
#   ansible.builtin.apt:
#     update_cache: true
#   become: true

- name: install curl, certificate and gnup
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: latest
    # update_cache: true
  become: true

- name: create folder for security key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: 0755
  become: true

- name: download GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: 0644
  become: true

- name: add official docker depot with deb828
 # https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/deb822_repository_module.html
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
  become: true

# - name: Ajouter le dépôt officiel Docker aux sources Linux
#   ansible.builtin.apt_repository:
#     repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
#     state: present
#     filename: docker
#   become: true

- name: Install docker engine
  # https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/apt_module.html#ansible-collections-ansible-builtin-apt-module
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    # update_cache: true
  become: true

- name: start docker
  # https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/systemd_service_module.html#ansible-collections-ansible-builtin-systemd-service-module
  ansible.builtin.systemd_service:
    name: docker
    state: started
  become: true
