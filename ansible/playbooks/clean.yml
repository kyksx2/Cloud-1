#? faire un clean qui arrete tout et supprimer le dossier cloud-1
---

- name: Clean deploy user and Cloud-1 stack
  hosts: webservers
  remote_user: root
  become: true

  tasks:
    - name: Check if Cloud-1 project directory exists
      ansible.builtin.stat:
        path: "/home/{{ deploy_user }}/var/www/cloud-1"
      register: project_dir

    - name: Tear down Docker Compose stack and purge resources
      community.docker.docker_compose_v2:
        project_src: "/home/{{ deploy_user }}/var/www/cloud-1"
        state: absent
        remove_images: all
        remove_volumes: true
      when: project_dir.stat.exists and project_dir.stat.isdir

    - name: Remove deploy_user account and home directory
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        state: absent
        remove: true