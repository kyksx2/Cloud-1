services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb_inc
    env_file:
      - .env
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - inception
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress_inc
    env_file:
      - .env
    volumes:
      - wp-volume:/var/www/wordpress
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always

  nginx:
    build: ./requirements/nginx
    container_name: nginx_inc
    ports:
      - "443:443"
    volumes:
      - wp-volume:/var/www/wordpress
    networks:
      - inception
    depends_on: 
      - wordpress
    restart: always

networks:
  inception:
    driver: bridge

volumes:
  db-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kjolly/data/mariadb

  wp-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kjolly/data/wordpress
